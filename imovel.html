<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMGlobal Realty — Imóvel</title>
<meta name="description" content="Ficha de uma residência da curadoria AMGlobal Realty.">
<meta name="theme-color" content="#0B0B0C">

<!-- PROVISORIO: enquanto o conteudo for de demonstracao, esta pagina fica fora
     dos buscadores. Tire esta linha quando o portfolio real entrar. -->
<meta name="robots" content="noindex, nofollow">

<!-- ---------------------------------------------------------------------------
     MODELO DE PAGINA DE IMOVEL

     E UM ARQUIVO SO para todas as residencias. O imovel vem no endereco:
       imovel.html?c=<cidade>&i=<posicao na lista daquela cidade>
     Exemplo: imovel.html?c=lisboa&i=0

     Endereco incompleto, cidade desconhecida ou posicao que nao existe caem num
     recado com link para a curadoria, e nao em pagina em branco.

     O CONTEUDO NAO MORA AQUI: esta em dados.js, o mesmo arquivo que o
     cidade.html usa. As instrucoes de como incluir imovel estao no cabecalho
     dele.

     ATENCAO: todo o conteudo e DE DEMONSTRACAO. Ver o aviso no dados.js.
     --------------------------------------------------------------------------- -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  :root {
    --onix: #0B0B0C;
    --marfim: #F5F2EC;
    --travertino: #D8CFC0;
    --grafite: #3A3A3C;
    --champagne: #B49A6E;
    --onix-alto: #131316;
    --linha-clara: rgba(245, 242, 236, 0.11);
    --linha-escura: rgba(11, 11, 12, 0.14);
    --texto-fraco: rgba(245, 242, 236, 0.58);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', Avenir, 'Helvetica Neue', Arial, sans-serif;
    --margem: clamp(22px, 6.5vw, 130px);
    --secao: clamp(80px, 12vh, 150px);
    --curva: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--onix);
    color: var(--marfim);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--champagne); color: var(--onix); }
  :focus-visible { outline: 1px solid var(--champagne); outline-offset: 6px; }

  .filete { display: block; width: 24px; height: 1px; background: var(--champagne); margin-bottom: 22px; }

  .rotulo {
    display: block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
  }

  h1, h2, h3 { font-family: var(--serif); font-weight: 300; line-height: 1.02; text-wrap: balance; }
  h2 { font-size: clamp(28px, 4vw, 48px); }
  p { max-width: 66ch; }

  .botao {
    position: relative;
    display: inline-block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding-bottom: 10px;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .botao::before, .botao::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    height: 1px;
  }

  .botao::before { width: 100%; background: currentColor; opacity: 0.28; }

  .botao::after {
    width: 100%;
    background: var(--champagne);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.7s var(--curva);
  }

  .botao:hover::after, .botao:focus-visible::after { transform: scaleX(1); }

  /* ------------------------------------------------------------- cabecalho */
  .topo {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px var(--margem);
    border-bottom: 1px solid transparent;
    transition: background 0.6s var(--curva), padding 0.6s var(--curva), border-color 0.6s var(--curva);
  }

  .topo.encolhido {
    background: rgba(11, 11, 12, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding-top: 14px;
    padding-bottom: 14px;
    border-bottom-color: var(--linha-clara);
  }

  .marca { display: flex; align-items: center; gap: 16px; }
  .marca img { height: 40px; width: auto; transition: height 0.6s var(--curva); }
  .topo.encolhido .marca img { height: 32px; }

  .marca-nome {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 11.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--marfim);
    white-space: nowrap;
  }

  .topo-direita { display: flex; align-items: center; gap: clamp(20px, 3vw, 40px); }

  .voltar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.8;
    transition: opacity 0.4s var(--curva);
    white-space: nowrap;
  }

  .voltar:hover { opacity: 1; }
  .voltar svg { color: var(--champagne); }

  /* ---------------------------------------------------------------- capa -- */
  .capa {
    position: relative;
    min-height: clamp(480px, 84vh, 800px);
    display: flex;
    align-items: flex-end;
    padding: clamp(120px, 17vh, 190px) var(--margem) clamp(38px, 5.5vh, 64px);
    overflow: hidden;
    background: var(--onix-alto);
  }

  .capa-foto { position: absolute; inset: 0; }

  .capa-foto img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(0.2) contrast(1.04) brightness(0.66) saturate(0.82);
    animation: crescer 18s ease-out both;
  }

  @keyframes crescer { from { transform: scale(1.02); } to { transform: scale(1.1); } }

  .capa::after {
    content: '';
    position: absolute;
    z-index: 2;
    inset: 0;
    background: linear-gradient(to top, rgba(11, 11, 12, 0.95) 0%, rgba(11, 11, 12, 0.4) 48%, rgba(11, 11, 12, 0.5) 100%);
  }

  .capa-corpo { position: relative; z-index: 3; width: 100%; }
  .capa h1 { font-size: clamp(38px, 7vw, 92px); letter-spacing: -0.015em; margin-bottom: 18px; }

  .capa-onde {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
    margin-bottom: 20px;
    display: block;
  }

  /* ---- a ficha, na propria capa ---- */
  .ficha {
    display: flex;
    flex-wrap: wrap;
    gap: 14px clamp(24px, 4vw, 64px);
    margin-top: clamp(26px, 4vh, 44px);
    padding-top: 22px;
    border-top: 1px solid rgba(245, 242, 236, 0.22);
  }

  .ficha-item { display: grid; gap: 5px; }

  .ficha-rotulo {
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.5);
  }

  .ficha-valor {
    font-family: var(--serif);
    font-size: clamp(20px, 2vw, 26px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* --------------------------------------------------------------- secoes -- */
  section { padding: var(--secao) var(--margem); }

  .sobre { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 90px); align-items: start; }
  .sobre p { color: var(--texto-fraco); font-size: clamp(16px, 1.25vw, 19px); }
  .sobre p + p { margin-top: 18px; }

  /* ============================================================== dossie ==
     Os dados em tres colunas: o texto, a ficha e as listas. As fotos NAO ficam
     aqui: elas tem um visor proprio, de largura cheia, logo abaixo.
     ------------------------------------------------------------------------ */
  .dossie {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(28px, 4vw, 76px);
    align-items: start;
    margin-top: clamp(44px, 7vh, 84px);
    padding-top: clamp(36px, 5.5vh, 60px);
    border-top: 1px solid var(--linha-clara);
  }

  .tecnica { display: grid; gap: clamp(26px, 4vh, 42px); }

  .tecnica-bloco .rotulo { margin-bottom: 16px; }

  /* ficha: rotulo em cima, valor embaixo, em duas colunas */
  .tecnica-lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }

  .tecnica-par {
    display: grid;
    gap: 4px;
    padding: 13px 0;
    border-top: 1px solid var(--linha-clara);
  }

  .tecnica-par:nth-child(odd) { padding-right: 14px; }

  .tecnica-rotulo {
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.42);
  }

  .tecnica-valor {
    font-family: var(--serif);
    font-size: clamp(17px, 1.5vw, 21px);
    line-height: 1.12;
    font-variant-numeric: tabular-nums;
  }

  /* listas simples, com marcador de filete */
  .tecnica-itens { list-style: none; display: grid; }

  .tecnica-itens li {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--linha-clara);
    font-size: 14.5px;
    color: rgba(245, 242, 236, 0.74);
  }

  .tecnica-itens li::before {
    content: '';
    width: 10px;
    height: 1px;
    background: var(--champagne);
    transform: translateY(-4px);
  }

  .tecnica-tempo {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.4);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* =============================================================== visor ==
     UMA foto de cada vez, de borda a borda. Trocar varre a nova por cima da
     anterior, da direita para a esquerda, e nao desbota. Tres camadas fixas: o
     fundo parado, a que sai e a que entra. Quem manda na visibilidade e a
     opacidade, entao mesmo que a animacao nao rode a foto troca.
     ------------------------------------------------------------------------ */
  .visor {
    position: relative;
    margin: 0 calc(-1 * var(--margem));
    height: clamp(430px, 78vh, 780px);
    overflow: hidden;
    background: var(--onix-alto);
    touch-action: pan-y;
  }

  .visor-foto { position: absolute; inset: 0; z-index: 1; opacity: 0; }
  .visor-foto.saindo { z-index: 2; opacity: 1; }

  .visor-foto.ativa {
    z-index: 3;
    opacity: 1;
    animation: varrer 1.1s var(--curva) both;
  }

  @keyframes varrer {
    from { clip-path: inset(0 0 0 100%); }
    to { clip-path: inset(0 0 0 0); }
  }

  .visor-foto img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(0.16) contrast(1.04) brightness(0.8) saturate(0.9);
    transform: scale(1.02);
  }

  .visor-foto.ativa img { animation: aproximar 10s ease-out both; }

  @keyframes aproximar {
    from { transform: scale(1.02); }
    to { transform: scale(1.1); }
  }

  /* veu curto so no pe, para a legenda ler */
  .visor::after {
    content: '';
    position: absolute;
    z-index: 4;
    inset: 0;
    background: linear-gradient(to top, rgba(11, 11, 12, 0.9) 0%, rgba(11, 11, 12, 0.1) 38%, transparent 100%);
    pointer-events: none;
  }

  .visor-barra {
    position: absolute;
    z-index: 5;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px clamp(20px, 3vw, 44px);
    padding: 0 var(--margem) clamp(26px, 3.4vw, 40px);
  }

  .visor-legenda { display: grid; gap: 9px; }

  .visor-conta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--serif);
    font-size: clamp(26px, 2.8vw, 38px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .visor-conta i { font-style: normal; font-size: 0.5em; color: var(--champagne); }
  .visor-conta b { font-weight: 300; font-size: 0.52em; color: rgba(245, 242, 236, 0.5); }

  .visor-texto {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(19px, 1.9vw, 26px);
    line-height: 1.1;
    color: var(--marfim);
  }

  /* trilho de traços: um por foto, o da vez em champagne e mais largo */
  .visor-trilho { display: flex; align-items: center; gap: 8px; }

  .visor-marca {
    width: clamp(26px, 3vw, 46px);
    height: 1px;
    padding: 12px 0;
    background: none;
    border: 0;
    cursor: pointer;
    position: relative;
  }

  .visor-marca::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: rgba(245, 242, 236, 0.32);
    transition: background 0.6s var(--curva), transform 0.6s var(--curva);
  }

  .visor-marca.ativo::after { background: var(--champagne); transform: scaleY(2); }
  .visor-marca:hover::after { background: var(--marfim); }

  .visor-setas { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }

  .visor-seta {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    background: none;
    border: 0;
    color: var(--marfim);
    cursor: pointer;
    transition: color 0.5s var(--curva), transform 0.6s var(--curva);
  }

  .visor-seta:hover { color: var(--champagne); }
  .visor-seta[data-visor="-1"]:hover { transform: translateX(-6px); }
  .visor-seta[data-visor="1"]:hover { transform: translateX(6px); }

  .tecnica-situacao {
    font-size: 14.5px;
    line-height: 1.5;
    color: rgba(245, 242, 236, 0.74);
    padding-top: 11px;
    border-top: 1px solid var(--linha-clara);
  }

  /* ---- o fecho ---- */
  .fecho { background: var(--marfim); color: var(--onix); }
  .fecho .rotulo { color: var(--grafite); }
  .fecho p { color: var(--grafite); }
  .fecho h2 { margin-bottom: 20px; }

  .fecho-grade { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(32px, 6vw, 96px); align-items: start; }
  .fecho-acoes { display: flex; flex-wrap: wrap; gap: 14px 36px; margin-top: 34px; }
  .fecho .botao::before { background: var(--onix); opacity: 0.22; }

  .vizinhas { display: grid; }

  .vizinha {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 0;
    border-top: 1px solid var(--linha-escura);
    transition: padding-left 0.6s var(--curva);
  }

  .vizinha:last-child { border-bottom: 1px solid var(--linha-escura); }
  .vizinha:hover { padding-left: 10px; }
  .vizinha-nome { font-family: var(--serif); font-size: clamp(19px, 1.8vw, 24px); color: var(--grafite); transition: color 0.5s var(--curva); }
  .vizinha:hover .vizinha-nome { color: var(--onix); }
  .vizinha-onde { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(58, 58, 60, 0.6); }

  /* --------------------------------------------------------------- rodape -- */
  footer {
    border-top: 1px solid var(--linha-clara);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: clamp(34px, 5vh, 56px) var(--margem);
  }

  footer img { height: 40px; width: auto; opacity: 0.8; }
  .rodape-texto { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(245, 242, 236, 0.4); }

  .recado { padding: clamp(150px, 26vh, 260px) var(--margem) var(--secao); }
  .recado h2 { margin-bottom: 20px; }
  .recado p { color: var(--texto-fraco); margin-bottom: 32px; }

  /* ------------------------------------------------------- telas estreitas -- */
  @media (max-width: 1000px) {
    .sobre { grid-template-columns: 1fr; }
    .fecho-grade { grid-template-columns: 1fr; }
    .dossie { grid-template-columns: 1fr; gap: clamp(30px, 5vh, 56px); }
  }

  @media (max-width: 900px) {
    .marca-nome { display: none; }
    .visor { height: clamp(360px, 62vh, 520px); }
    .visor-barra { flex-direction: column; align-items: flex-start; }
    .visor-setas { width: 100%; justify-content: space-between; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .capa-foto img,
    .visor-foto.ativa,
    .visor-foto.ativa img { animation: none !important; }
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="topo" id="topo">
  <a class="marca" href="index.html" aria-label="AMGlobal Realty, ir para o início">
    <img src="marca.svg" alt="AMGlobal Realty" width="200" height="176">
    <span class="marca-nome">AMGlobal Realty</span>
  </a>

  <div class="topo-direita">
    <a class="voltar" id="voltar" href="index.html#curadoria">
      <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <path d="M15 5 H1 M5 1 L1 5 L5 9"/>
      </svg>
      <span id="voltarTexto">Toda a curadoria</span>
    </a>
    <a class="botao" href="index.html#contato">Fale com um consultor</a>
  </div>
</header>

<main id="pagina"></main>

<noscript>
  <div class="recado">
    <span class="filete"></span>
    <h2>Esta página precisa de JavaScript</h2>
    <p>As fichas dos imóveis são montadas no navegador. Ative o JavaScript ou volte à curadoria completa.</p>
    <a class="botao" href="index.html#curadoria">Ver toda a curadoria</a>
  </div>
</noscript>

<footer>
  <img src="marca.svg" alt="AMGlobal Realty" width="200" height="176">
  <span class="rodape-texto">Imóveis extraordinários. Visão global.</span>
  <span class="rodape-texto">CRECI a informar &middot; 2026</span>
</footer>

<script src="dados.js"></script>
<script>
(function () {
  'use strict';

  var BASE = window.AMGLOBAL || { CIDADES: {}, ORDEM: [] };
  var CIDADES = BASE.CIDADES;

  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function doEndereco(chave) {
    var m = (window.location.search || '').match(new RegExp('[?&]' + chave + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }

  function chapa(ft, i) {
    return '<div class="visor-foto' + (i === 0 ? ' ativa' : '') + '" data-foto="' + i + '">'
      + '<img src="' + esc(ft.src) + '" alt="" ' + (i === 0 ? 'fetchpriority="high"' : 'loading="lazy"') + ' decoding="async">'
      + '</div>';
  }

  function marca(ft, i) {
    return '<button type="button" class="visor-marca' + (i === 0 ? ' ativo' : '') + '"'
      + ' data-ir="' + i + '" aria-label="Ver a foto ' + (i + 1) + ', ' + esc(ft.legenda) + '"></button>';
  }

  var SETA_ESQ = '<svg width="20" height="12" viewBox="0 0 20 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M19 6 H1 M7 1 L1 6 L7 11"/></svg>';
  var SETA_DIR = '<svg width="20" height="12" viewBox="0 0 20 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 6 H19 M13 1 L19 6 L13 11"/></svg>';

  function visor(fotos) {
    var total = fotos.length;
    return '<div class="visor" id="visor">'
      + fotos.map(chapa).join('')
      + '<div class="visor-barra">'
      +   '<div class="visor-legenda">'
      +     '<span class="visor-conta"><span id="visorNum">01</span><i>/</i><b>' + ('0' + total).slice(-2) + '</b></span>'
      +     '<span class="visor-texto" id="visorTexto">' + esc(fotos[0].legenda) + '</span>'
      +   '</div>'
      +   '<div class="visor-setas">'
      +     '<div class="visor-trilho" id="visorTrilho">' + fotos.map(marca).join('') + '</div>'
      +     '<button type="button" class="visor-seta" data-visor="-1" aria-label="Foto anterior">' + SETA_ESQ + '</button>'
      +     '<button type="button" class="visor-seta" data-visor="1" aria-label="Próxima foto">' + SETA_DIR + '</button>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }

  function par(rotulo, valor) {
    if (!valor) return '';
    return '<div class="tecnica-par">'
      + '<span class="tecnica-rotulo">' + esc(rotulo) + '</span>'
      + '<span class="tecnica-valor">' + esc(valor) + '</span>'
      + '</div>';
  }

  function itens(lista) {
    return '<ul class="tecnica-itens">'
      + lista.map(function (x) { return '<li><span>' + esc(x) + '</span></li>'; }).join('')
      + '</ul>';
  }

  function itensComTempo(lista) {
    return '<ul class="tecnica-itens">'
      + lista.map(function (x) {
          return '<li><span>' + esc(x[0]) + '</span><span class="tecnica-tempo">' + esc(x[1]) + '</span></li>';
        }).join('')
      + '</ul>';
  }

  function vizinha(slug, im, i) {
    return '<a class="vizinha" href="imovel.html?c=' + esc(slug) + '&i=' + i + '">'
      + '<span class="vizinha-nome">' + esc(im.nome) + '</span>'
      + '<span class="vizinha-onde">' + esc(im.bairro) + '</span>'
      + '</a>';
  }

  function montar(slug, i) {
    var c = CIDADES[slug];
    var im = c.imoveis[i];
    var outras = c.imoveis.map(function (x, k) { return { im: x, k: k }; })
      .filter(function (o) { return o.k !== i; });

    var paragrafos = String(im.texto).split(/\n+/).map(function (t) {
      return '<p>' + esc(t) + '</p>';
    }).join('');

    return ''
      + '<section class="capa">'
      +   '<div class="capa-foto"><img src="' + esc(im.fotos[0].src) + '" alt="" fetchpriority="high" decoding="async"></div>'
      +   '<div class="capa-corpo">'
      +     '<span class="filete"></span>'
      +     '<span class="capa-onde">' + esc(im.bairro) + ' &middot; ' + esc(c.nome) + ' &middot; ' + esc(c.pais) + '</span>'
      +     '<h1>' + esc(im.nome) + '</h1>'
      +     '<div class="ficha">'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Área</span><span class="ficha-valor">' + esc(im.area) + '</span></div>'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Suítes</span><span class="ficha-valor">' + esc(im.suites) + '</span></div>'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Vagas</span><span class="ficha-valor">' + esc(im.vagas) + '</span></div>'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Valor</span><span class="ficha-valor">Sob consulta</span></div>'
      +     '</div>'
      +   '</div>'
      + '</section>'

      + '<section>'
      +   '<div class="sobre">'
      +     '<div>'
      +       '<span class="filete"></span>'
      +       '<span class="rotulo">A residência</span>'
      +     '</div>'
      +     '<div>' + paragrafos + '</div>'
      +   '</div>'

      +   '<div class="dossie">'
      +     '<div class="tecnica">'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Ficha técnica</span>'
      +         '<div class="tecnica-lista">'
      +         par('Área construída', im.area)
      +         par('Terreno', im.terreno)
      +         par('Suítes', im.suites)
      +         par('Vagas', im.vagas)
      +         par('Ano', im.ano)
      +         par('Orientação', im.orientacao)
      +         par('Condomínio', im.condominio)
      +         par('IPTU', im.iptu)
      +         '</div>'
      +       '</div>'
      +     '</div>'
      +     '<div class="tecnica">'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Ambientes</span>'
      +         itens(im.ambientes || [])
      +       '</div>'
      +     '</div>'
      +     '<div class="tecnica">'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Ao redor</span>'
      +         itensComTempo(im.perto || [])
      +       '</div>'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Situação</span>'
      +         '<p class="tecnica-situacao">' + esc(im.situacao) + '</p>'
      +       '</div>'
      +     '</div>'
      +   '</div>'
      + '</section>'

      + '<section class="visor-secao">'
      +   visor(im.fotos)
      + '</section>'

      + '<section class="fecho">'
      +   '<div class="fecho-grade">'
      +     '<div>'
      +       '<span class="filete"></span>'
      +       '<span class="rotulo">Visita</span>'
      +       '<h2>Conheça pessoalmente</h2>'
      +       '<p>As visitas são agendadas com hora marcada e acompanhadas por um consultor. O dossiê completo, com planta e documentação, é enviado antes.</p>'
      +       '<div class="fecho-acoes">'
      +         '<a class="botao" href="index.html#contato">Agende uma visita privada</a>'
      +         '<a class="botao" href="index.html#contato">Solicite o dossiê</a>'
      +       '</div>'
      +     '</div>'
      +     '<div>'
      +       (outras.length
              ? '<span class="rotulo" style="margin-bottom:18px">Também em ' + esc(c.nome) + '</span>'
                + '<div class="vizinhas">' + outras.map(function (o) { return vizinha(slug, o.im, o.k); }).join('') + '</div>'
              : '')
      +     '</div>'
      +   '</div>'
      + '</section>';
  }

  function recado() {
    return '<div class="recado">'
      + '<span class="filete"></span>'
      + '<span class="rotulo">Imóvel não encontrado</span>'
      + '<h2>Não achamos esta<br>residência</h2>'
      + '<p>O endereço pode ter sido digitado errado, ou o imóvel pode ter saído da curadoria. Veja o que está disponível agora.</p>'
      + '<a class="botao" href="index.html#curadoria">Ver toda a curadoria</a>'
      + '</div>';
  }

  // ------------------------------------------------------------------ na tela
  var slug = doEndereco('c').toLowerCase();
  var i = parseInt(doEndereco('i'), 10);
  var alvo = document.getElementById('pagina');
  var cidade = CIDADES[slug];
  var vale = cidade && !isNaN(i) && i >= 0 && cidade.imoveis[i];

  if (!vale) {
    alvo.innerHTML = recado();
    document.title = 'AMGlobal Realty — imóvel não encontrado';
  } else {
    alvo.innerHTML = montar(slug, i);
    document.title = cidade.imoveis[i].nome + ', ' + cidade.nome + ' — AMGlobal Realty';

    // o "voltar" leva para a cidade de onde a pessoa veio
    var voltar = document.getElementById('voltar');
    var voltarTexto = document.getElementById('voltarTexto');
    if (voltar && voltarTexto) {
      voltar.setAttribute('href', 'cidade.html?c=' + encodeURIComponent(slug));
      voltarTexto.textContent = cidade.nome;
    }

    /* ---- o visor ----
       Tres camadas fixas: fundo parado, a que sai e a que entra varrendo por
       cima. A que entra reinicia a animacao a cada troca, senao da segunda vez
       em diante ela nao animaria. A que sai fica visivel por baixo ate a
       varredura terminar, para a nova passar por cima da anterior. */
    var caixa = document.getElementById('visor');

    if (caixa) {
      var fotos = cidade.imoveis[i].fotos;
      var chapas = caixa.querySelectorAll('.visor-foto');
      var marcas = caixa.querySelectorAll('.visor-marca');
      var oNum = document.getElementById('visorNum');
      var oTexto = document.getElementById('visorTexto');
      var atual = 0;
      var limpeza = null;

      function ir(n) {
        n = (n + chapas.length) % chapas.length;
        if (n === atual) return;

        var saindo = chapas[atual];
        var entrando = chapas[n];

        Array.prototype.forEach.call(chapas, function (c) { c.classList.remove('saindo'); });
        saindo.classList.remove('ativa');
        saindo.classList.add('saindo');

        entrando.classList.remove('ativa');
        void entrando.offsetWidth;
        entrando.classList.add('ativa');

        window.clearTimeout(limpeza);
        limpeza = window.setTimeout(function () { saindo.classList.remove('saindo'); }, 1250);

        atual = n;
        oNum.textContent = ('0' + (n + 1)).slice(-2);
        oTexto.textContent = fotos[n].legenda;
        Array.prototype.forEach.call(marcas, function (m, k) { m.classList.toggle('ativo', k === n); });
      }

      caixa.addEventListener('click', function (ev) {
        var seta = ev.target.closest('.visor-seta');
        if (seta) { ir(atual + parseInt(seta.getAttribute('data-visor'), 10)); return; }
        var m = ev.target.closest('.visor-marca');
        if (m) ir(parseInt(m.getAttribute('data-ir'), 10));
      });

      // setas do teclado, so quando o visor esta na tela
      document.addEventListener('keydown', function (ev) {
        if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
        var r = caixa.getBoundingClientRect();
        if (r.bottom < 0 || r.top > window.innerHeight) return;
        ir(atual + (ev.key === 'ArrowRight' ? 1 : -1));
      });

      // arrastar com o dedo
      var partiu = null;
      caixa.addEventListener('pointerdown', function (ev) { partiu = ev.clientX; });
      caixa.addEventListener('pointerup', function (ev) {
        if (partiu === null) return;
        var d = ev.clientX - partiu;
        partiu = null;
        if (Math.abs(d) > 46) ir(atual + (d < 0 ? 1 : -1));
      });
      caixa.addEventListener('pointercancel', function () { partiu = null; });
    }
  }

  var topo = document.getElementById('topo');
  var pedido = false;
  function aoRolar() {
    if (pedido) return;
    pedido = true;
    window.requestAnimationFrame(function () {
      topo.classList.toggle('encolhido', window.scrollY > 80);
      pedido = false;
    });
  }
  window.addEventListener('scroll', aoRolar, { passive: true });
  aoRolar();
})();
</script>

</body>
</html>
