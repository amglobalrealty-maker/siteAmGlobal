<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMGlobal Realty — Imóvel</title>
<meta name="description" content="Ficha de uma residência da curadoria AMGlobal Realty.">
<meta name="theme-color" content="#0B0B0C">

<!-- PROVISORIO: enquanto o conteudo for de demonstracao, esta pagina fica fora
     dos buscadores. Tire esta linha quando o portfolio real entrar. -->
<meta name="robots" content="noindex, nofollow">

<!-- ---------------------------------------------------------------------------
     MODELO DE PAGINA DE IMOVEL

     E UM ARQUIVO SO para todas as residencias. O imovel vem no endereco:
       imovel.html?c=<cidade>&i=<posicao na lista daquela cidade>
     Exemplo: imovel.html?c=lisboa&i=0

     Endereco incompleto, cidade desconhecida ou posicao que nao existe caem num
     recado com link para a curadoria, e nao em pagina em branco.

     O CONTEUDO NAO MORA AQUI: esta em dados.js, o mesmo arquivo que o
     cidade.html usa. As instrucoes de como incluir imovel estao no cabecalho
     dele.

     ATENCAO: todo o conteudo e DE DEMONSTRACAO. Ver o aviso no dados.js.
     --------------------------------------------------------------------------- -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  :root {
    --onix: #0B0B0C;
    --marfim: #F5F2EC;
    --travertino: #D8CFC0;
    --grafite: #3A3A3C;
    --champagne: #B49A6E;
    --onix-alto: #131316;
    --linha-clara: rgba(245, 242, 236, 0.11);
    --linha-escura: rgba(11, 11, 12, 0.14);
    --texto-fraco: rgba(245, 242, 236, 0.58);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', Avenir, 'Helvetica Neue', Arial, sans-serif;
    --margem: clamp(22px, 6.5vw, 130px);
    --secao: clamp(80px, 12vh, 150px);
    --curva: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--onix);
    color: var(--marfim);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--champagne); color: var(--onix); }
  :focus-visible { outline: 1px solid var(--champagne); outline-offset: 6px; }

  .filete { display: block; width: 24px; height: 1px; background: var(--champagne); margin-bottom: 22px; }

  .rotulo {
    display: block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
  }

  h1, h2, h3 { font-family: var(--serif); font-weight: 300; line-height: 1.02; text-wrap: balance; }
  h2 { font-size: clamp(28px, 4vw, 48px); }
  p { max-width: 66ch; }

  .botao {
    position: relative;
    display: inline-block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding-bottom: 10px;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .botao::before, .botao::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    height: 1px;
  }

  .botao::before { width: 100%; background: currentColor; opacity: 0.28; }

  .botao::after {
    width: 100%;
    background: var(--champagne);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.7s var(--curva);
  }

  .botao:hover::after, .botao:focus-visible::after { transform: scaleX(1); }

  /* ------------------------------------------------------------- cabecalho */
  .topo {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px var(--margem);
    border-bottom: 1px solid transparent;
    transition: background 0.6s var(--curva), padding 0.6s var(--curva), border-color 0.6s var(--curva);
  }

  .topo.encolhido {
    background: rgba(11, 11, 12, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding-top: 14px;
    padding-bottom: 14px;
    border-bottom-color: var(--linha-clara);
  }

  .marca { display: flex; align-items: center; gap: 16px; }
  .marca img { height: 40px; width: auto; transition: height 0.6s var(--curva); }
  .topo.encolhido .marca img { height: 32px; }

  .marca-nome {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 11.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--marfim);
    white-space: nowrap;
  }

  .topo-direita { display: flex; align-items: center; gap: clamp(20px, 3vw, 40px); }

  .voltar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.8;
    transition: opacity 0.4s var(--curva);
    white-space: nowrap;
  }

  .voltar:hover { opacity: 1; }
  .voltar svg { color: var(--champagne); }

  /* ---------------------------------------------------------------- capa -- */
  .capa {
    position: relative;
    min-height: clamp(480px, 84vh, 800px);
    display: flex;
    align-items: flex-end;
    padding: clamp(120px, 17vh, 190px) var(--margem) clamp(38px, 5.5vh, 64px);
    overflow: hidden;
    background: var(--onix-alto);
  }

  .capa-foto { position: absolute; inset: 0; }

  .capa-foto img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(0.2) contrast(1.04) brightness(0.66) saturate(0.82);
    animation: crescer 18s ease-out both;
  }

  @keyframes crescer { from { transform: scale(1.02); } to { transform: scale(1.1); } }

  .capa::after {
    content: '';
    position: absolute;
    z-index: 2;
    inset: 0;
    background: linear-gradient(to top, rgba(11, 11, 12, 0.95) 0%, rgba(11, 11, 12, 0.4) 48%, rgba(11, 11, 12, 0.5) 100%);
  }

  .capa-corpo { position: relative; z-index: 3; width: 100%; }
  .capa h1 { font-size: clamp(38px, 7vw, 92px); letter-spacing: -0.015em; margin-bottom: 18px; }

  .capa-onde {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
    margin-bottom: 20px;
    display: block;
  }

  /* ---- a ficha, na propria capa ---- */
  .ficha {
    display: flex;
    flex-wrap: wrap;
    gap: 14px clamp(24px, 4vw, 64px);
    margin-top: clamp(26px, 4vh, 44px);
    padding-top: 22px;
    border-top: 1px solid rgba(245, 242, 236, 0.22);
  }

  .ficha-item { display: grid; gap: 5px; }

  .ficha-rotulo {
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.5);
  }

  .ficha-valor {
    font-family: var(--serif);
    font-size: clamp(20px, 2vw, 26px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* --------------------------------------------------------------- secoes -- */
  section { padding: var(--secao) var(--margem); }

  .sobre { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 90px); align-items: start; }
  .sobre p { color: var(--texto-fraco); font-size: clamp(16px, 1.25vw, 19px); }
  .sobre p + p { margin-top: 18px; }

  /* ============================================================== dossie ==
     A ficha tecnica fica parada de um lado enquanto as fotos correm do outro.
     Assim a pessoa nunca perde os numeros de vista, e cada foto vem com o nome
     do que esta mostrando: a galeria informa, em vez de so enfileirar imagem.
     ------------------------------------------------------------------------ */
  .dossie {
    display: grid;
    grid-template-columns: minmax(0, 0.62fr) minmax(0, 1.38fr);
    gap: clamp(30px, 5vw, 92px);
    align-items: start;
    margin-top: clamp(48px, 8vh, 96px);
    padding-top: clamp(38px, 6vh, 64px);
    border-top: 1px solid var(--linha-clara);
  }

  .tecnica { position: sticky; top: clamp(96px, 13vh, 128px); display: grid; gap: clamp(28px, 4vh, 44px); }

  .tecnica-bloco .rotulo { margin-bottom: 16px; }

  /* ficha: rotulo em cima, valor embaixo, em duas colunas */
  .tecnica-lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }

  .tecnica-par {
    display: grid;
    gap: 4px;
    padding: 13px 0;
    border-top: 1px solid var(--linha-clara);
  }

  .tecnica-par:nth-child(odd) { padding-right: 14px; }

  .tecnica-rotulo {
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.42);
  }

  .tecnica-valor {
    font-family: var(--serif);
    font-size: clamp(17px, 1.5vw, 21px);
    line-height: 1.12;
    font-variant-numeric: tabular-nums;
  }

  /* listas simples, com marcador de filete */
  .tecnica-itens { list-style: none; display: grid; }

  .tecnica-itens li {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--linha-clara);
    font-size: 14.5px;
    color: rgba(245, 242, 236, 0.74);
  }

  .tecnica-itens li::before {
    content: '';
    width: 10px;
    height: 1px;
    background: var(--champagne);
    transform: translateY(-4px);
  }

  .tecnica-tempo {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.4);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ---- as fotos, uma embaixo da outra, legendadas ---- */
  .galeria { display: grid; gap: clamp(22px, 3.4vh, 46px); }

  .galeria figure { margin: 0; }

  .galeria-chapa {
    position: relative;
    overflow: hidden;
    background: var(--onix-alto);
    aspect-ratio: 3 / 2;
  }

  /* a segunda foto entra mais estreita e recuada: quebra a fila */
  .galeria figure:nth-child(even) .galeria-chapa { aspect-ratio: 4 / 5; }
  .galeria figure:nth-child(even) { width: min(100%, 66%); margin-left: auto; }

  .galeria img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(0.2) contrast(1.04) brightness(0.84) saturate(0.88);
    transform: scale(1.02);
    transition: filter 1.1s var(--curva), transform 1.8s var(--curva);
  }

  .galeria figure:hover img { filter: grayscale(0.02) brightness(0.98) saturate(0.98); transform: scale(1.06); }

  .galeria figcaption {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-top: 13px;
    font-size: 12.5px;
    color: rgba(245, 242, 236, 0.55);
  }

  .galeria-num {
    font-size: 9.5px;
    letter-spacing: 0.2em;
    color: var(--champagne);
    font-variant-numeric: tabular-nums;
  }

  .tecnica-situacao {
    font-size: 14.5px;
    line-height: 1.5;
    color: rgba(245, 242, 236, 0.74);
    padding-top: 11px;
    border-top: 1px solid var(--linha-clara);
  }

  /* ---- o fecho ---- */
  .fecho { background: var(--marfim); color: var(--onix); }
  .fecho .rotulo { color: var(--grafite); }
  .fecho p { color: var(--grafite); }
  .fecho h2 { margin-bottom: 20px; }

  .fecho-grade { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(32px, 6vw, 96px); align-items: start; }
  .fecho-acoes { display: flex; flex-wrap: wrap; gap: 14px 36px; margin-top: 34px; }
  .fecho .botao::before { background: var(--onix); opacity: 0.22; }

  .vizinhas { display: grid; }

  .vizinha {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 0;
    border-top: 1px solid var(--linha-escura);
    transition: padding-left 0.6s var(--curva);
  }

  .vizinha:last-child { border-bottom: 1px solid var(--linha-escura); }
  .vizinha:hover { padding-left: 10px; }
  .vizinha-nome { font-family: var(--serif); font-size: clamp(19px, 1.8vw, 24px); color: var(--grafite); transition: color 0.5s var(--curva); }
  .vizinha:hover .vizinha-nome { color: var(--onix); }
  .vizinha-onde { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(58, 58, 60, 0.6); }

  /* --------------------------------------------------------------- rodape -- */
  footer {
    border-top: 1px solid var(--linha-clara);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: clamp(34px, 5vh, 56px) var(--margem);
  }

  footer img { height: 40px; width: auto; opacity: 0.8; }
  .rodape-texto { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(245, 242, 236, 0.4); }

  .recado { padding: clamp(150px, 26vh, 260px) var(--margem) var(--secao); }
  .recado h2 { margin-bottom: 20px; }
  .recado p { color: var(--texto-fraco); margin-bottom: 32px; }

  /* ------------------------------------------------------- telas estreitas -- */
  @media (max-width: 1000px) {
    .sobre { grid-template-columns: 1fr; }
    .fecho-grade { grid-template-columns: 1fr; }
    .dossie { grid-template-columns: 1fr; gap: clamp(30px, 5vh, 56px); }
  }

  @media (max-width: 900px) {
    .marca-nome { display: none; }
    /* sem coluna ao lado, a ficha deixa de ser fixa e as fotos ocupam tudo */
    .tecnica { position: static; }
    .galeria figure:nth-child(even) { width: 100%; margin-left: 0; }
    .galeria figure:nth-child(even) .galeria-chapa { aspect-ratio: 3 / 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .capa-foto img { animation: none; }
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="topo" id="topo">
  <a class="marca" href="index.html" aria-label="AMGlobal Realty, ir para o início">
    <img src="marca.svg" alt="AMGlobal Realty" width="200" height="176">
    <span class="marca-nome">AMGlobal Realty</span>
  </a>

  <div class="topo-direita">
    <a class="voltar" id="voltar" href="index.html#curadoria">
      <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <path d="M15 5 H1 M5 1 L1 5 L5 9"/>
      </svg>
      <span id="voltarTexto">Toda a curadoria</span>
    </a>
    <a class="botao" href="index.html#contato">Fale com um consultor</a>
  </div>
</header>

<main id="pagina"></main>

<noscript>
  <div class="recado">
    <span class="filete"></span>
    <h2>Esta página precisa de JavaScript</h2>
    <p>As fichas dos imóveis são montadas no navegador. Ative o JavaScript ou volte à curadoria completa.</p>
    <a class="botao" href="index.html#curadoria">Ver toda a curadoria</a>
  </div>
</noscript>

<footer>
  <img src="marca.svg" alt="AMGlobal Realty" width="200" height="176">
  <span class="rodape-texto">Imóveis extraordinários. Visão global.</span>
  <span class="rodape-texto">CRECI a informar &middot; 2026</span>
</footer>

<script src="dados.js"></script>
<script>
(function () {
  'use strict';

  var BASE = window.AMGLOBAL || { CIDADES: {}, ORDEM: [] };
  var CIDADES = BASE.CIDADES;

  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function doEndereco(chave) {
    var m = (window.location.search || '').match(new RegExp('[?&]' + chave + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }

  function figura(ft, i) {
    return '<figure>'
      + '<div class="galeria-chapa"><img src="' + esc(ft.src) + '" alt="" loading="lazy" decoding="async"></div>'
      + '<figcaption><span class="galeria-num">' + ('0' + (i + 1)) + '</span>'
      + '<span>' + esc(ft.legenda) + '</span></figcaption>'
      + '</figure>';
  }

  function par(rotulo, valor) {
    if (!valor) return '';
    return '<div class="tecnica-par">'
      + '<span class="tecnica-rotulo">' + esc(rotulo) + '</span>'
      + '<span class="tecnica-valor">' + esc(valor) + '</span>'
      + '</div>';
  }

  function itens(lista) {
    return '<ul class="tecnica-itens">'
      + lista.map(function (x) { return '<li><span>' + esc(x) + '</span></li>'; }).join('')
      + '</ul>';
  }

  function itensComTempo(lista) {
    return '<ul class="tecnica-itens">'
      + lista.map(function (x) {
          return '<li><span>' + esc(x[0]) + '</span><span class="tecnica-tempo">' + esc(x[1]) + '</span></li>';
        }).join('')
      + '</ul>';
  }

  function vizinha(slug, im, i) {
    return '<a class="vizinha" href="imovel.html?c=' + esc(slug) + '&i=' + i + '">'
      + '<span class="vizinha-nome">' + esc(im.nome) + '</span>'
      + '<span class="vizinha-onde">' + esc(im.bairro) + '</span>'
      + '</a>';
  }

  function montar(slug, i) {
    var c = CIDADES[slug];
    var im = c.imoveis[i];
    var outras = c.imoveis.map(function (x, k) { return { im: x, k: k }; })
      .filter(function (o) { return o.k !== i; });

    var paragrafos = String(im.texto).split(/\n+/).map(function (t) {
      return '<p>' + esc(t) + '</p>';
    }).join('');

    return ''
      + '<section class="capa">'
      +   '<div class="capa-foto"><img src="' + esc(im.fotos[0].src) + '" alt="" fetchpriority="high" decoding="async"></div>'
      +   '<div class="capa-corpo">'
      +     '<span class="filete"></span>'
      +     '<span class="capa-onde">' + esc(im.bairro) + ' &middot; ' + esc(c.nome) + ' &middot; ' + esc(c.pais) + '</span>'
      +     '<h1>' + esc(im.nome) + '</h1>'
      +     '<div class="ficha">'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Área</span><span class="ficha-valor">' + esc(im.area) + '</span></div>'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Suítes</span><span class="ficha-valor">' + esc(im.suites) + '</span></div>'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Vagas</span><span class="ficha-valor">' + esc(im.vagas) + '</span></div>'
      +       '<div class="ficha-item"><span class="ficha-rotulo">Valor</span><span class="ficha-valor">Sob consulta</span></div>'
      +     '</div>'
      +   '</div>'
      + '</section>'

      + '<section>'
      +   '<div class="sobre">'
      +     '<div>'
      +       '<span class="filete"></span>'
      +       '<span class="rotulo">A residência</span>'
      +     '</div>'
      +     '<div>' + paragrafos + '</div>'
      +   '</div>'

      +   '<div class="dossie">'
      +     '<aside class="tecnica">'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Ficha técnica</span>'
      +         '<div class="tecnica-lista">'
      +         par('Área construída', im.area)
      +         par('Terreno', im.terreno)
      +         par('Suítes', im.suites)
      +         par('Vagas', im.vagas)
      +         par('Ano', im.ano)
      +         par('Orientação', im.orientacao)
      +         par('Condomínio', im.condominio)
      +         par('IPTU', im.iptu)
      +         '</div>'
      +       '</div>'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Ambientes</span>'
      +         itens(im.ambientes || [])
      +       '</div>'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Ao redor</span>'
      +         itensComTempo(im.perto || [])
      +       '</div>'
      +       '<div class="tecnica-bloco">'
      +         '<span class="rotulo">Situação</span>'
      +         '<p class="tecnica-situacao">' + esc(im.situacao) + '</p>'
      +       '</div>'
      +     '</aside>'
      +     '<div class="galeria">' + im.fotos.map(figura).join('') + '</div>'
      +   '</div>'
      + '</section>'

      + '<section class="fecho">'
      +   '<div class="fecho-grade">'
      +     '<div>'
      +       '<span class="filete"></span>'
      +       '<span class="rotulo">Visita</span>'
      +       '<h2>Conheça pessoalmente</h2>'
      +       '<p>As visitas são agendadas com hora marcada e acompanhadas por um consultor. O dossiê completo, com planta e documentação, é enviado antes.</p>'
      +       '<div class="fecho-acoes">'
      +         '<a class="botao" href="index.html#contato">Agende uma visita privada</a>'
      +         '<a class="botao" href="index.html#contato">Solicite o dossiê</a>'
      +       '</div>'
      +     '</div>'
      +     '<div>'
      +       (outras.length
              ? '<span class="rotulo" style="margin-bottom:18px">Também em ' + esc(c.nome) + '</span>'
                + '<div class="vizinhas">' + outras.map(function (o) { return vizinha(slug, o.im, o.k); }).join('') + '</div>'
              : '')
      +     '</div>'
      +   '</div>'
      + '</section>';
  }

  function recado() {
    return '<div class="recado">'
      + '<span class="filete"></span>'
      + '<span class="rotulo">Imóvel não encontrado</span>'
      + '<h2>Não achamos esta<br>residência</h2>'
      + '<p>O endereço pode ter sido digitado errado, ou o imóvel pode ter saído da curadoria. Veja o que está disponível agora.</p>'
      + '<a class="botao" href="index.html#curadoria">Ver toda a curadoria</a>'
      + '</div>';
  }

  // ------------------------------------------------------------------ na tela
  var slug = doEndereco('c').toLowerCase();
  var i = parseInt(doEndereco('i'), 10);
  var alvo = document.getElementById('pagina');
  var cidade = CIDADES[slug];
  var vale = cidade && !isNaN(i) && i >= 0 && cidade.imoveis[i];

  if (!vale) {
    alvo.innerHTML = recado();
    document.title = 'AMGlobal Realty — imóvel não encontrado';
  } else {
    alvo.innerHTML = montar(slug, i);
    document.title = cidade.imoveis[i].nome + ', ' + cidade.nome + ' — AMGlobal Realty';

    // o "voltar" leva para a cidade de onde a pessoa veio
    var voltar = document.getElementById('voltar');
    var voltarTexto = document.getElementById('voltarTexto');
    if (voltar && voltarTexto) {
      voltar.setAttribute('href', 'cidade.html?c=' + encodeURIComponent(slug));
      voltarTexto.textContent = cidade.nome;
    }
  }

  var topo = document.getElementById('topo');
  var pedido = false;
  function aoRolar() {
    if (pedido) return;
    pedido = true;
    window.requestAnimationFrame(function () {
      topo.classList.toggle('encolhido', window.scrollY > 80);
      pedido = false;
    });
  }
  window.addEventListener('scroll', aoRolar, { passive: true });
  aoRolar();
})();
</script>

</body>
</html>
