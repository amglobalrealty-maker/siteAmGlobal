<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMGlobal Realty — Curadoria por cidade</title>
<meta name="description" content="A curadoria da AMGlobal Realty na cidade escolhida.">
<meta name="theme-color" content="#0B0B0C">

<!-- PROVISORIO: enquanto o conteudo for de demonstracao, esta pagina fica fora
     dos buscadores. Tire esta linha quando o portfolio real entrar. -->
<meta name="robots" content="noindex, nofollow">

<!-- ---------------------------------------------------------------------------
     MODELO DE PAGINA DE CIDADE

     E UM ARQUIVO SO para as oito cidades. A cidade vem no endereco, em `?c=`:
       cidade.html?c=sao-paulo, cidade.html?c=dubai, e assim por diante.
     Endereco sem `?c=` ou com cidade desconhecida cai num recado com link para
     a home, e nao em pagina em branco.

     O CONTEUDO NAO MORA AQUI: esta em dados.js, que o imovel.html tambem
     carrega. Mexer la muda as duas paginas. As instrucoes de como incluir
     cidade e imovel estao no cabecalho daquele arquivo.

     ATENCAO: todo o conteudo e DE DEMONSTRACAO. Ver o aviso no dados.js.
     --------------------------------------------------------------------------- -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  :root {
    --onix: #0B0B0C;
    --marfim: #F5F2EC;
    --travertino: #D8CFC0;
    --grafite: #3A3A3C;
    --champagne: #B49A6E;
    --onix-alto: #131316;
    --linha-clara: rgba(245, 242, 236, 0.11);
    --linha-escura: rgba(11, 11, 12, 0.14);
    --texto-fraco: rgba(245, 242, 236, 0.58);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', Avenir, 'Helvetica Neue', Arial, sans-serif;
    --margem: clamp(22px, 6.5vw, 130px);
    --secao: clamp(84px, 13vh, 160px);
    --curva: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--onix);
    color: var(--marfim);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img { max-width: 100%; display: block; }
  /* nenhum link pega o azul do navegador: a cor vem sempre do bloco em volta */
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--champagne); color: var(--onix); }
  :focus-visible { outline: 1px solid var(--champagne); outline-offset: 6px; }

  .filete { display: block; width: 24px; height: 1px; background: var(--champagne); margin-bottom: 22px; }

  .rotulo {
    display: block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
  }

  h1, h2, h3 { font-family: var(--serif); font-weight: 300; line-height: 1.02; text-wrap: balance; }
  h2 { font-size: clamp(30px, 4.6vw, 56px); }
  h3 { font-size: clamp(22px, 2.3vw, 30px); font-weight: 400; line-height: 1.12; }
  p { max-width: 66ch; }

  .botao {
    position: relative;
    display: inline-block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: inherit;
    text-decoration: none;
    padding-bottom: 10px;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .botao::before, .botao::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    height: 1px;
  }

  .botao::before { width: 100%; background: currentColor; opacity: 0.28; }

  .botao::after {
    width: 100%;
    background: var(--champagne);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.7s var(--curva);
  }

  .botao:hover::after, .botao:focus-visible::after { transform: scaleX(1); }

  /* ------------------------------------------------------------- cabecalho */
  .topo {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px var(--margem);
    border-bottom: 1px solid transparent;
    transition: background 0.6s var(--curva), padding 0.6s var(--curva), border-color 0.6s var(--curva);
  }

  .topo.encolhido {
    background: rgba(11, 11, 12, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding-top: 14px;
    padding-bottom: 14px;
    border-bottom-color: var(--linha-clara);
  }

  .marca { display: flex; align-items: center; gap: 16px; text-decoration: none; }
  .marca img { height: 40px; width: auto; transition: height 0.6s var(--curva); }
  .topo.encolhido .marca img { height: 32px; }

  /* sem cor declarada, o nome herdava o azul de link do navegador */
  .marca-nome {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 11.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--marfim);
    white-space: nowrap;
  }

  .topo-direita { display: flex; align-items: center; gap: clamp(20px, 3vw, 40px); }

  .voltar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--marfim);
    text-decoration: none;
    opacity: 0.8;
    transition: opacity 0.4s var(--curva);
  }

  .voltar:hover { opacity: 1; }
  .voltar svg { color: var(--champagne); }

  /* ---------------------------------------------------------------- capa -- */
  .capa {
    position: relative;
    min-height: clamp(460px, 78vh, 760px);
    display: flex;
    align-items: flex-end;
    padding: clamp(120px, 17vh, 190px) var(--margem) clamp(40px, 6vh, 70px);
    overflow: hidden;
    background: var(--onix-alto);
  }

  .capa-foto { position: absolute; inset: 0; }

  .capa-foto img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(0.3) contrast(1.05) brightness(0.62) saturate(0.74);
    animation: crescer 16s ease-out both;
  }

  @keyframes crescer { from { transform: scale(1.02); } to { transform: scale(1.1); } }

  .capa::after {
    content: '';
    position: absolute;
    z-index: 2;
    inset: 0;
    background: linear-gradient(to top, rgba(11, 11, 12, 0.95) 0%, rgba(11, 11, 12, 0.45) 46%, rgba(11, 11, 12, 0.55) 100%);
  }

  .capa-corpo { position: relative; z-index: 3; width: 100%; }

  .capa h1 {
    font-size: clamp(46px, 9vw, 122px);
    letter-spacing: -0.015em;
    margin-bottom: 22px;
  }

  .capa-linha { color: rgba(245, 242, 236, 0.82); font-size: clamp(16px, 1.3vw, 19px); max-width: 48ch; }

  .capa-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px clamp(22px, 3vw, 44px);
    margin-top: clamp(30px, 5vh, 52px);
    padding-top: 22px;
    border-top: 1px solid var(--linha-clara);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.6);
    font-variant-numeric: tabular-nums;
  }

  /* --------------------------------------------------------------- secoes -- */
  section { padding: var(--secao) var(--margem); }

  .cabeca {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr);
    gap: clamp(28px, 5vw, 90px);
    align-items: end;
    margin-bottom: clamp(44px, 7vh, 80px);
  }

  .cabeca .rotulo { margin-bottom: 20px; }
  .cabeca-texto { padding-bottom: 8px; color: var(--texto-fraco); }

  /* ---- a banda das residencias, igual a da home ---- */
  .leque { display: flex; gap: 5px; height: clamp(360px, 56vh, 590px); overflow: hidden; }

  .leque-item {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    padding: 0;
    background: var(--onix-alto);
    border: 0;
    color: inherit;
    cursor: pointer;
    overflow: hidden;
    transition: flex-grow 1.1s var(--curva);
  }

  .leque-item.aberto { flex-grow: 4.4; }

  .leque-item img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(0.5) contrast(1.05) brightness(0.55) saturate(0.6);
    transition: filter 1.2s var(--curva), transform 1.6s var(--curva);
  }

  .leque-item.aberto img { filter: grayscale(0.06) contrast(1.02) brightness(0.92) saturate(0.96); transform: scale(1.03); }

  .leque-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(11, 11, 12, 0.85) 0%, rgba(11, 11, 12, 0.1) 46%, transparent 100%);
    pointer-events: none;
  }

  .leque-item::before {
    content: '';
    position: absolute;
    z-index: 3;
    left: 0; top: 0; bottom: 0;
    width: 1px;
    background: var(--champagne);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 1s var(--curva);
  }

  .leque-item.aberto::before { transform: scaleY(1); }

  .leque-num {
    position: absolute;
    z-index: 2;
    top: 18px; left: 0; right: 0;
    text-align: center;
    font-family: var(--sans);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: rgba(245, 242, 236, 0.5);
    font-variant-numeric: tabular-nums;
    transition: color 0.8s var(--curva);
  }

  .leque-item.aberto .leque-num { color: var(--champagne); }

  .leque-vertical {
    position: absolute;
    z-index: 2;
    left: 0; right: 0; bottom: 22px;
    display: flex;
    justify-content: center;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.82);
    white-space: nowrap;
    transition: opacity 0.5s var(--curva);
  }

  .leque-vertical span { writing-mode: vertical-rl; transform: rotate(180deg); }
  .leque-item.aberto .leque-vertical { opacity: 0; }

  .leque-ficha {
    position: absolute;
    z-index: 2;
    left: 0; right: 0; bottom: 0;
    display: grid;
    gap: 9px;
    padding: 0 clamp(18px, 2vw, 30px) clamp(20px, 2.4vw, 30px);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.8s var(--curva) 0.25s, transform 0.9s var(--curva) 0.25s;
    text-align: left;
    pointer-events: none;
  }

  .leque-item.aberto .leque-ficha { opacity: 1; transform: none; }

  .leque-nome { font-family: var(--serif); font-size: clamp(24px, 2.4vw, 34px); line-height: 1.05; white-space: nowrap; }

  .leque-entrar {
    margin-top: 4px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
    white-space: nowrap;
  }
  .leque-lugar { font-family: var(--sans); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--champagne); white-space: nowrap; }

  .leque-dados {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 20px;
    padding-top: 11px;
    border-top: 1px solid rgba(245, 242, 236, 0.18);
    font-size: 12.5px;
    color: rgba(245, 242, 236, 0.66);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .conta {
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.34);
    font-variant-numeric: tabular-nums;
  }

  /* ---- as notas da praca ---- */
  .notas { background: var(--marfim); color: var(--onix); }
  .notas .rotulo { color: var(--grafite); }
  .notas .cabeca-texto { color: var(--grafite); }
  .notas p { color: var(--grafite); }

  /* A praca: retrato da cidade de um lado, as tres notas do outro.

     Antes eram tres linhas largas atravessando a pagina, com um vazio enorme
     no meio e o texto jogado na beirada. Agora a imagem ocupa esse vazio e as
     notas ficam numa coluna de leitura de verdade. */
  .praca {
    display: grid;
    grid-template-columns: minmax(0, 0.78fr) minmax(0, 1fr);
    gap: clamp(30px, 5vw, 88px);
    align-items: start;
  }

  .praca-foto { position: relative; margin: 0; }

  .praca-foto img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    filter: grayscale(0.18) contrast(1.03) brightness(0.95) saturate(0.9);
  }

  /* fio champagne deslocado no alto a esquerda: emoldura sem fechar moldura */
  .praca-foto::before {
    content: '';
    position: absolute;
    z-index: 2;
    top: clamp(-20px, -1.5vw, -12px);
    left: clamp(-20px, -1.5vw, -12px);
    width: 46%;
    height: 40%;
    border-top: 1px solid rgba(180, 154, 110, 0.7);
    border-left: 1px solid rgba(180, 154, 110, 0.7);
    pointer-events: none;
  }

  .praca-foto figcaption {
    margin-top: 15px;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--grafite);
  }

  .notas-lista { display: grid; }

  .nota {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: clamp(16px, 2.4vw, 36px);
    align-items: baseline;
    padding: clamp(22px, 3.4vh, 34px) 0;
    border-top: 1px solid var(--linha-escura);
  }

  .nota:first-child { border-top: 0; padding-top: 0; }

  /* o numeral cresceu e virou champagne: era um cinza miudo que nao dizia nada */
  .nota-num {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(26px, 3vw, 40px);
    line-height: 1;
    color: rgba(180, 154, 110, 0.9);
    font-variant-numeric: tabular-nums;
  }

  .nota-corpo { display: grid; gap: 10px; }
  .nota h3 { font-size: clamp(21px, 2.1vw, 27px); }
  .nota p { font-size: 15.5px; max-width: 52ch; }

  /* ---- o fecho ---- */
  .fecho { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(36px, 6vw, 100px); align-items: start; }
  .fecho h2 { margin-bottom: 24px; }
  .fecho p { color: var(--texto-fraco); }
  .fecho-acao { margin-top: 36px; }

  .outras { display: grid; gap: 2px; }

  .outra {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 0;
    border-top: 1px solid var(--linha-clara);
    color: var(--marfim);
    text-decoration: none;
    transition: padding-left 0.6s var(--curva);
  }

  .outra:last-child { border-bottom: 1px solid var(--linha-clara); }
  .outra:hover { padding-left: 10px; }
  .outra-nome { font-family: var(--serif); font-size: clamp(19px, 1.8vw, 24px); color: rgba(245, 242, 236, 0.62); transition: color 0.5s var(--curva); }
  .outra:hover .outra-nome { color: var(--marfim); }
  .outra-pais { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(245, 242, 236, 0.34); }

  /* --------------------------------------------------------------- rodape -- */
  footer {
    border-top: 1px solid var(--linha-clara);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: clamp(34px, 5vh, 56px) var(--margem);
  }

  footer img { height: 40px; width: auto; opacity: 0.8; }
  .rodape-texto { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(245, 242, 236, 0.4); }

  /* --------------------------------------------------------------- recado -- */
  .recado { padding: clamp(150px, 26vh, 260px) var(--margem) var(--secao); }
  .recado h2 { margin-bottom: 20px; }
  .recado p { color: var(--texto-fraco); margin-bottom: 32px; }

  /* ------------------------------------------------------- telas estreitas -- */
  @media (max-width: 1100px) {
    .cabeca { grid-template-columns: 1fr; align-items: start; }
    .fecho { grid-template-columns: 1fr; }
  }

  @media (max-width: 900px) {
    .marca-nome { display: none; }
    .leque {
      height: clamp(380px, 62vh, 540px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .leque::-webkit-scrollbar { display: none; }
    .leque-item { flex: 0 0 78%; scroll-snap-align: center; }
    .leque-item.aberto { flex-grow: 0; }
    .leque-item img { filter: grayscale(0.08) contrast(1.02) brightness(0.9) saturate(0.95); }
    .leque-vertical { display: none; }
    .leque-ficha { opacity: 1; transform: none; }
    .leque-item::before { transform: scaleY(1); }
    /* a foto vai para cima e as notas descem, numa coluna so */
    .praca { grid-template-columns: 1fr; gap: 30px; }
    .praca-foto img { aspect-ratio: 4 / 3; }
    .praca-foto::before { width: 38%; height: 46%; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .capa-foto img { animation: none; }
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="topo" id="topo">
  <a class="marca" href="index.html" aria-label="AMGlobal Realty, ir para o início">
    <img src="marca.svg" alt="AMGlobal Realty" width="200" height="176">
    <span class="marca-nome">AMGlobal Realty</span>
  </a>

  <div class="topo-direita">
    <a class="voltar" href="index.html#curadoria">
      <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <path d="M15 5 H1 M5 1 L1 5 L5 9"/>
      </svg>
      <span>Toda a curadoria</span>
    </a>
    <a class="botao" href="index.html#contato">Fale com um consultor</a>
  </div>
</header>

<main id="pagina"></main>

<noscript>
  <div class="recado">
    <span class="filete"></span>
    <h2>Esta página precisa de JavaScript</h2>
    <p>As páginas de cidade são montadas no navegador. Ative o JavaScript ou volte à curadoria completa.</p>
    <a class="botao" href="index.html#curadoria">Ver toda a curadoria</a>
  </div>
</noscript>

<footer>
  <img src="marca.svg" alt="AMGlobal Realty" width="200" height="176">
  <span class="rodape-texto">Imóveis extraordinários. Visão global.</span>
  <span class="rodape-texto">CRECI a informar &middot; 2026</span>
</footer>

<script src="dados.js"></script>
<script>
(function () {
  'use strict';

  var BASE = window.AMGLOBAL || { CIDADES: {}, ORDEM: [] };
  var CIDADES = BASE.CIDADES;
  var ORDEM = BASE.ORDEM;

  // --------------------------------------------------------------- utilidades
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function doEndereco() {
    var busca = window.location.search || '';
    var m = busca.match(/[?&]c=([^&]+)/);
    return m ? decodeURIComponent(m[1]).toLowerCase() : '';
  }

  // ------------------------------------------------------------------ montagem
  /* Cada lamina e um LINK para a pagina do imovel. No toque, o primeiro toque
     abre a lamina e o segundo entra: por isso o clique numa lamina fechada nao
     navega. No computador, onde apontar ja abre, o clique entra direto. */
  function lamina(im, i, slug) {
    return '<a class="leque-item' + (i === 0 ? ' aberto' : '') + '"'
      + ' href="imovel.html?c=' + esc(slug) + '&amp;i=' + i + '">'
      + '<img src="' + esc(im.fotos[0].src) + '" alt="" loading="lazy" decoding="async">'
      + '<span class="leque-num">' + ('0' + (i + 1)) + '</span>'
      + '<span class="leque-vertical"><span>' + esc(im.bairro) + '</span></span>'
      + '<span class="leque-ficha">'
      + '<span class="leque-nome">' + esc(im.nome) + '</span>'
      + '<span class="leque-lugar">' + esc(im.bairro) + '</span>'
      + '<span class="leque-dados"><span>' + esc(im.area) + '</span><span>' + esc(im.suites) + '</span><span>Sob consulta</span></span>'
      + '<span class="leque-entrar">Ver o imóvel</span>'
      + '</span>'
      + '</a>';
  }

  function nota(n, i) {
    return '<div class="nota">'
      + '<span class="nota-num">0' + (i + 1) + '</span>'
      + '<div class="nota-corpo">'
      +   '<h3>' + esc(n[0]) + '</h3>'
      +   '<p>' + esc(n[1]) + '</p>'
      + '</div>'
      + '</div>';
  }

  function outra(slug) {
    var c = CIDADES[slug];
    return '<a class="outra" href="cidade.html?c=' + esc(slug) + '">'
      + '<span class="outra-nome">' + esc(c.nome) + '</span>'
      + '<span class="outra-pais">' + esc(c.pais) + '</span>'
      + '</a>';
  }

  function montar(slug) {
    var c = CIDADES[slug];
    var quantos = c.imoveis.length;

    var vizinhas = ORDEM.filter(function (s) { return s !== slug; }).slice(0, 5);

    return ''
      + '<section class="capa">'
      +   '<div class="capa-foto"><img src="' + esc(c.capa) + '" alt="" fetchpriority="high" decoding="async"></div>'
      +   '<div class="capa-corpo">'
      +     '<span class="filete"></span>'
      +     '<span class="rotulo">' + esc(c.pais) + '</span>'
      +     '<h1>' + esc(c.nome) + '</h1>'
      +     '<p class="capa-linha">' + esc(c.linha) + '</p>'
      +     '<div class="capa-meta">'
      +       '<span>' + quantos + (quantos === 1 ? ' residência em curadoria' : ' residências em curadoria') + '</span>'
      +       '<span>Valores sob consulta</span>'
      +       '<span>Visitas privadas</span>'
      +     '</div>'
      +   '</div>'
      + '</section>'

      + '<section>'
      +   '<div class="cabeca">'
      +     '<div>'
      +       '<span class="filete"></span>'
      +       '<span class="rotulo">A seleção</span>'
      +       '<h2>Poucos imóveis.<br>Nenhum comum.</h2>'
      +     '</div>'
      +     '<div class="cabeca-texto"><p>Cada residência está aqui por arquitetura, endereço, história ou a combinação dos três. Parte do portfólio não é publicada e só é apresentada em conversa.</p></div>'
      +   '</div>'
      +   '<div class="leque" id="leque">' + c.imoveis.map(function (im, i) { return lamina(im, i, slug); }).join('') + '</div>'
      +   '<p class="conta">' + quantos + ' de ' + quantos + ' residências em ' + esc(c.nome) + '</p>'
      + '</section>'

      + '<section class="notas">'
      +   '<div class="cabeca">'
      +     '<div>'
      +       '<span class="filete"></span>'
      +       '<span class="rotulo">A praça</span>'
      +       '<h2>O que pesa<br>em ' + esc(c.nome) + '</h2>'
      +     '</div>'
      +     '<div class="cabeca-texto"><p>Três coisas que mudam a decisão nesta cidade, e que raramente aparecem num anúncio.</p></div>'
      +   '</div>'
      +   '<div class="praca">'
      +     '<figure class="praca-foto">'
      +       '<img src="' + esc(c.retrato || c.capa) + '" alt="" loading="lazy" decoding="async">'
      +       '<figcaption>' + esc(c.nome) + ' &middot; ' + esc(c.pais) + '</figcaption>'
      +     '</figure>'
      +     '<div class="notas-lista">' + c.notas.map(nota).join('') + '</div>'
      +   '</div>'
      + '</section>'

      + '<section>'
      +   '<div class="fecho">'
      +     '<div>'
      +       '<span class="filete"></span>'
      +       '<span class="rotulo">Contato</span>'
      +       '<h2>Comece por<br>uma conversa</h2>'
      +       '<p>Conte o que você procura em ' + esc(c.nome) + '. Respondemos com uma seleção objetiva, não com uma lista.</p>'
      +       '<p class="fecho-acao"><a class="botao" href="index.html#contato">Agende uma visita privada</a></p>'
      +     '</div>'
      +     '<div>'
      +       '<span class="rotulo" style="margin-bottom:18px">Outras praças</span>'
      +       '<div class="outras">' + vizinhas.map(outra).join('') + '</div>'
      +     '</div>'
      +   '</div>'
      + '</section>';
  }

  function recado() {
    return '<div class="recado">'
      + '<span class="filete"></span>'
      + '<span class="rotulo">Praça não encontrada</span>'
      + '<h2>Não temos esta cidade<br>na curadoria</h2>'
      + '<p>O endereço pode ter sido digitado errado. Veja a curadoria completa e escolha a praça pelo filtro do topo.</p>'
      + '<a class="botao" href="index.html#curadoria">Ver toda a curadoria</a>'
      + '</div>';
  }

  // ------------------------------------------------------------------ na tela
  var slug = doEndereco();
  var alvo = document.getElementById('pagina');
  var cidade = CIDADES[slug];

  if (!cidade) {
    alvo.innerHTML = recado();
    document.title = 'AMGlobal Realty — praça não encontrada';
  } else {
    alvo.innerHTML = montar(slug);
    document.title = cidade.nome + ' — AMGlobal Realty';

    // a banda: a lamina apontada se abre
    var leque = document.getElementById('leque');
    if (leque) {
      var laminas = leque.querySelectorAll('.leque-item');

      function abrir(alvoLamina) {
        Array.prototype.forEach.call(laminas, function (l) {
          l.classList.toggle('aberto', l === alvoLamina);
        });
      }

      var tocando = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      leque.addEventListener('click', function (ev) {
        var l = ev.target.closest('.leque-item');
        if (!l) return;
        // no toque, lamina fechada so abre; entrar exige o segundo toque
        if (tocando && !l.classList.contains('aberto')) {
          ev.preventDefault();
          abrir(l);
        }
      });

      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        Array.prototype.forEach.call(laminas, function (l) {
          l.addEventListener('mouseenter', function () { abrir(l); });
          l.addEventListener('focus', function () { abrir(l); });
        });
      }
    }
  }

  // o cabecalho ganha fundo depois da capa
  var topo = document.getElementById('topo');
  var pedido = false;
  function aoRolar() {
    if (pedido) return;
    pedido = true;
    window.requestAnimationFrame(function () {
      topo.classList.toggle('encolhido', window.scrollY > 80);
      pedido = false;
    });
  }
  window.addEventListener('scroll', aoRolar, { passive: true });
  aoRolar();
})();
</script>

</body>
</html>
